<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>워들 대결</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
:root{
  --bg:#121417; --panel:#1b1e23; --panel2:#23272e; --line:#343a43; --text:#e8eaed; --dim:#8b929c;
  --g:#3fa660; --y:#c9a227; --b:#3a3f47; --accent:#5b8def; --red:#e5534b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input{font:inherit}
.hidden{display:none!important}

/* ---------- 입장 화면 ---------- */
#entry{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.entry-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:380px}
.logo{display:flex;gap:4px;justify-content:center;margin-bottom:6px}
.logo span{width:38px;height:38px;display:grid;place-items:center;font-weight:800;font-size:20px;border-radius:6px}
.entry-card h1{margin:4px 0 2px;text-align:center;font-size:22px}
.entry-card p.sub{margin:0 0 22px;text-align:center;color:var(--dim);font-size:14px}
label.f{display:block;font-size:13px;color:var(--dim);margin:14px 0 6px}
.inp{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);outline:none}
.inp:focus{border-color:var(--accent)}
.btn{padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:600}
.btn:hover{border-color:#4a515c}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px}
.row .inp{flex:1}
.divider{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12px;margin:18px 0 4px}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.entry-msg{min-height:20px;margin-top:14px;font-size:13px;color:var(--dim);text-align:center}

/* ---------- 게임 화면 ---------- */
#game{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header .title{font-weight:800;font-size:18px;margin-right:6px}
.chip{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.chip b{color:var(--text);letter-spacing:1px}
.spacer{flex:1}
#timer{font-variant-numeric:tabular-nums;font-weight:700}
#timer.warn{color:var(--red);border-color:var(--red)}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(220px,1fr) minmax(330px,540px) 310px;gap:0}
.col{min-height:0;overflow:auto;padding:16px}
.col.side{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:0}
.col.opps{border-right:1px solid var(--line)}
.sec-title{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.5px;text-transform:uppercase;margin:0 0 10px}

/* 상대 보드 */
.opp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.opp.me{border-color:#3b4a66}
.opp-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px}
.opp-head .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opp-head .sc{margin-left:auto;color:var(--dim);font-size:13px;white-space:nowrap}
.badge{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--panel2);color:var(--dim);white-space:nowrap}
.badge.win{background:var(--g);color:#fff}
.badge.fail{background:#5a2a2a;color:#ffb4b0}
.badge.host{background:#2b3a5c;color:#a9c3ff}
.mini{display:grid;gap:3px;width:max-content}
.mini .mr{display:grid;gap:3px}
.mini .mc{width:16px;height:16px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);font-size:10px;font-weight:700;display:grid;place-items:center;text-transform:uppercase}
.mini .mc.g{background:var(--g);border-color:var(--g)}
.mini .mc.y{background:var(--y);border-color:var(--y)}
.mini .mc.b{background:var(--b);border-color:var(--b)}
.mini .mc.t{border-color:#8b929c;background:#2c3138}
.mini.big .mc{width:22px;height:22px;font-size:12px}

/* 내 보드 */
.center{display:flex;flex-direction:column;align-items:center}
#board{display:grid;gap:6px;margin:6px 0 16px}
.brow{display:grid;gap:6px}
.tile{width:var(--ts);height:var(--ts);border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;
  font-size:calc(var(--ts) * .5);font-weight:800;text-transform:uppercase;user-select:none}
.tile.filled{border-color:#6b7280;animation:pop .1s}
.tile.g{background:var(--g);border-color:var(--g)}
.tile.y{background:var(--y);border-color:var(--y)}
.tile.b{background:var(--b);border-color:var(--b)}
.tile.reveal{animation:flip .45s ease both}
.brow.shake{animation:shake .4s}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes flip{0%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

#kb{width:100%;max-width:520px;user-select:none}
.kr{display:flex;gap:5px;justify-content:center;margin-bottom:6px}
.key{flex:1;max-width:44px;height:52px;border:none;border-radius:6px;background:#4b525c;font-weight:700;font-size:15px;text-transform:uppercase}
.key.wide{max-width:70px;flex:1.5;font-size:12px}
.key.g{background:var(--g)} .key.y{background:var(--y)} .key.b{background:#2a2e34;color:#6b7280}
.key:active{filter:brightness(1.2)}

/* 대기/결과 패널 */
.panel{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.panel h2{margin:0 0 12px;font-size:18px}
.opt{margin-bottom:14px}
.opt .lb{font-size:13px;color:var(--dim);margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:14px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.seg button:disabled{cursor:default}
.seg button:disabled:not(.on){opacity:.5}
.hint{font-size:13px;color:var(--dim);margin:6px 0 0}
.answer{font-size:30px;font-weight:800;letter-spacing:6px;text-transform:uppercase;margin:2px 0 4px}
.answer a{color:var(--accent);font-size:13px;letter-spacing:0;font-weight:600;margin-left:8px;text-decoration:none}
table.rank{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}
table.rank td,table.rank th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
table.rank th{color:var(--dim);font-weight:600;font-size:12px}
.plus{color:var(--g);font-weight:700}
.reveal-boards{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px}
.reveal-boards .rb .n{font-size:12px;color:var(--dim);margin-bottom:4px}

/* 채팅 */
.chat-head{padding:12px 14px;border-bottom:1px solid var(--line)}
#players{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#players .pp{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
#chatLog{flex:1;overflow:auto;padding:10px 14px;font-size:14px;min-height:120px}
.cm{margin-bottom:7px;line-height:1.4;word-break:break-word}
.cm .who{font-weight:700;margin-right:6px}
.cm.sys{color:var(--dim);font-size:12.5px}
.chat-in{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.chat-in .inp{padding:9px 10px}

#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#f2f3f5;color:#111;padding:10px 16px;border-radius:10px;
  font-weight:600;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

@media (max-width:1000px){
  .layout{grid-template-columns:1fr;display:flex;flex-direction:column;overflow:auto}
  .col{overflow:visible;flex-shrink:0}
  header{padding:8px 12px;gap:6px}
  header .title{font-size:16px}
  .key{height:48px}
  .col.opps{border-right:none;order:2;display:flex;gap:10px;overflow-x:auto;padding-top:0}
  .col.opps .sec-title{display:none}
  .col.opps .opp{flex:0 0 auto;margin:0}
  .col.center{order:1}
  .col.side{order:3;border-left:none;border-top:1px solid var(--line);min-height:320px;max-height:420px}
}
</style>
</head>
<body>

<!-- 입장 화면 -->
<div id="entry">
  <div class="entry-card">
    <div class="logo">
      <span style="background:var(--g)">W</span><span style="background:var(--y)">O</span><span style="background:var(--b)">R</span><span style="background:var(--g)">D</span><span style="background:var(--y)">S</span>
    </div>
    <h1>워들 대결</h1>
    <p class="sub">친구들과 같은 단어를 누가 먼저 맞히나 겨뤄요</p>

    <label class="f" for="nameInp">닉네임</label>
    <input id="nameInp" class="inp" maxlength="12" placeholder="닉네임 입력">

    <div style="margin-top:16px">
      <button id="createBtn" class="btn primary" style="width:100%">새 방 만들기</button>
    </div>
    <div class="divider">또는 방 코드로 참가</div>
    <div class="row" style="margin-top:8px">
      <input id="codeInp" class="inp" maxlength="5" placeholder="방 코드 (예: K7Q2M)" style="text-transform:uppercase">
      <button id="joinBtn" class="btn">참가</button>
    </div>
    <div id="entryMsg" class="entry-msg"></div>
  </div>
</div>

<!-- 게임 화면 -->
<div id="game" class="hidden">
  <header>
    <span class="title">워들 대결</span>
    <span class="chip">방 코드 <b id="roomCode">-----</b></span>
    <button id="copyBtn" class="btn" style="padding:5px 10px;font-size:13px">초대 링크 복사</button>
    <span class="spacer"></span>
    <span id="dictChip" class="chip">사전 불러오는 중…</span>
    <span id="roundChip" class="chip hidden"></span>
    <span id="timer" class="chip hidden"></span>
  </header>
  <div class="layout">
    <div class="col opps">
      <div class="sec-title">상대 진행 상황</div>
      <div id="opps"></div>
    </div>
    <div class="col center">
      <div id="panel" class="panel hidden"></div>
      <div id="playArea" class="center" style="width:100%">
        <div id="board"></div>
        <div id="kb"></div>
      </div>
    </div>
    <div class="col side">
      <div class="chat-head">
        <div class="sec-title" style="margin:0">채팅</div>
        <div id="players"></div>
      </div>
      <div id="chatLog"></div>
      <form id="chatForm" class="chat-in" autocomplete="off">
        <input id="chatInp" class="inp" maxlength="200" placeholder="메시지 입력… (Enter로 전송)" style="min-width:0">
        <button class="btn primary" style="padding:9px 12px;white-space:nowrap">전송</button>
      </form>
    </div>
  </div>
</div>

<div id="toast"></div>

let DICT = null;            // Set — 단어 검사용 사전
let dictFailed = false;

async function loadDict(){
  const urls = [
    "https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt",
    "https://cdn.jsdelivr.net/gh/dwyl/english-words@master/words_alpha.txt"
  ];
  for (const u of urls){
    try{
      const r = await fetch(u);
      if(!r.ok) continue;
      const txt = await r.text();
      const s = new Set();
      for (const w of txt.split(/\r?\n/)){
        const t = w.trim().toLowerCase();
        if (t.length>=5 && t.length<=8 && /^[a-z]+$/.test(t)) s.add(t);
      }
      for (const k in ANSWERS) for (const w of ANSWERS[k]) s.add(w);
      if (s.size > 1000){ DICT = s; updateDictChip(); return; }
    }catch(e){}
  }
  dictFailed = true; updateDictChip();
}
function updateDictChip(){
  const c = document.getElementById("dictChip");
  if (DICT){ c.textContent = "사전 ✓"; c.title = "사전에 있는 단어만 입력할 수 있어요"; }
  else if (dictFailed){ c.textContent = "사전 없음 (모든 단어 허용)"; c.title = "사전을 불러오지 못해 아무 단어나 입력할 수 있어요"; }
}
function isValidWord(w){
  if (!/^[a-z]+$/.test(w)) return false;
  if (DICT) return DICT.has(w);
  return true;
}

/* 채점: g=자리까지 맞음, y=글자만 있음, b=없음 */
function evaluate(guess, answer){
  const n = answer.length, res = Array(n).fill("b"), cnt = {};
  for (let i=0;i<n;i++){
    if (guess[i]===answer[i]) res[i]="g";
    else cnt[answer[i]] = (cnt[answer[i]]||0)+1;
  }
  for (let i=0;i<n;i++){
    if (res[i]!=="g" && cnt[guess[i]]>0){ res[i]="y"; cnt[guess[i]]--; }
  }
  return res.join("");
}

const JAMO_KEY = {"ㅂ":"q","ㅈ":"w","ㄷ":"e","ㄱ":"r","ㅅ":"t","ㅛ":"y","ㅕ":"u","ㅑ":"i","ㅐ":"o","ㅔ":"p","ㅁ":"a","ㄴ":"s","ㅇ":"d","ㄹ":"f","ㅎ":"g","ㅗ":"h","ㅓ":"j","ㅏ":"k","ㅣ":"l","ㅋ":"z","ㅌ":"x","ㅊ":"c","ㅍ":"v","ㅠ":"b","ㅜ":"n","ㅡ":"m",
 "ㅃ":"q","ㅉ":"w","ㄸ":"e","ㄲ":"rr","ㅆ":"tt","ㅒ":"o","ㅖ":"p","ㅘ":"hk","ㅙ":"ho","ㅚ":"hl","ㅝ":"nj","ㅞ":"np","ㅟ":"nl","ㅢ":"ml",
 "ㄳ":"rt","ㄵ":"sw","ㄶ":"sg","ㄺ":"fr","ㄻ":"fa","ㄼ":"fq","ㄽ":"ft","ㄾ":"fx","ㄿ":"fv","ㅀ":"fg","ㅄ":"qt"};
const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ", JUNG="ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ", JONG=" ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ";
function hangulToKeys(str){
  let out = "";
  for (const ch of str){
    const c = ch.charCodeAt(0);
    if (c>=0xAC00 && c<=0xD7A3){
      const i = c-0xAC00, jo = i%28, ju = Math.floor(i/28)%21, ch0 = Math.floor(i/588);
      out += (JAMO_KEY[CHO[ch0]]||"") + (JAMO_KEY[JUNG[ju]]||"") + (jo ? (JAMO_KEY[JONG[jo]]||"") : "");
    } else out += JAMO_KEY[ch] || ch;
  }
  return out;
}
function normCode(v){ return hangulToKeys(v).toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,5); }

const H = {
  players: new Map(),   // id -> {name, score, conn, joinedAt}
  phase: "lobby",
  settings: { len:5, time:180, mode:"all" },
  roundNo: 0,
  round: null,

};

function hostAddChat(entry){
  H.chat.push(entry); if (H.chat.length>80) H.chat.shift();
  hostBroadcastRaw({t:"chat", entry});
}
function sysMsg(text){ hostAddChat({sys:true, text, at:Date.now()}); }

function uniqueName(name, id){
  name = (name||"").trim().slice(0,12) || "플레이어";
  const names = new Set([...H.players].filter(([k])=>k!==id).map(([,p])=>p.name));
  let n = name, i = 2;
  while (names.has(n)) n = name + i++;
  return n;
}

function hostState(forId){
  const r = H.round;
  let round = null;
  if (r){
    const boards = {};
    for (const id in r.boards){
      const b = r.boards[id];
      boards[id] = {
        pats: b.pats, solved: b.solved, done: b.done, typing: b.typing, finishMs: b.finishMs,
        words: (H.phase==="result" || id===forId) ? b.words : null
      };
    }
    round = {
      len: r.len, maxRows: r.maxRows, boards,
      remaining: r.deadline ? Math.max(0, r.deadline - Date.now()) : null,
      answer: H.phase==="result" ? r.answer : null,
      results: H.phase==="result" ? r.results : null
    };
  }
  return {
    t:"state", phase:H.phase, settings:H.settings, roundNo:H.roundNo, hostId:myId,
    players:[...H.players].map(([id,p])=>({id, name:p.name, score:p.score})),
    round
  };
}
function hostBroadcastRaw(msg){
  for (const [id,p] of H.players){
    if (id===myId) onMessage(msg);
    else if (p.conn && p.conn.open) { try{ p.conn.send(msg); }catch(e){} }
  }
}
function hostBroadcastState(){
  for (const [id,p] of H.players){
    const st = hostState(id);
    if (id===myId) onMessage(st);
    else if (p.conn && p.conn.open) { try{ p.conn.send(st); }catch(e){} }
  }
}
function sendTo(id, msg){
  if (id===myId) onMessage(msg);
  else { const p = H.players.get(id); if (p && p.conn && p.conn.open) p.conn.send(msg); }
}

function hostStartRound(){
  const len = H.settings.len;
  const list = ANSWERS[len];
  let pool = list.filter(w=>!H.used.has(w));
  if (!pool.length){ list.forEach(w=>H.used.delete(w)); pool = list.slice(); }
  const answer = pool[Math.floor(Math.random()*pool.length)];
  H.used.add(answer);
  const boards = {};
  for (const id of H.players.keys()) boards[id] = {pats:[], words:[], solved:false, done:false, typing:0, finishMs:null};
  H.roundNo++;
  H.round = {
    answer, len, maxRows: MAX_ROWS[len], boards, startedAt: Date.now(),
    deadline: H.settings.time ? Date.now() + H.settings.time*1000 : null,
    order: [], results: null
  };
  H.phase = "playing";
  clearTimeout(H.timer);
  if (H.round.deadline) H.timer = setTimeout(()=>hostEndRound("time"), H.settings.time*1000 + 200);
  sysMsg(`${H.roundNo}라운드 시작! ${len}글자 단어예요.`);
  hostBroadcastState();
}

function hostCheckEnd(){
  const r = H.round; if (!r || H.phase!=="playing") return;
  const bs = Object.values(r.boards);
  if (H.settings.mode==="first" && r.order.length>0) return hostEndRound("first");
  if (bs.length===0 || bs.every(b=>b.done)) return hostEndRound("all");
}

function hostEndRound(reason){
  const r = H.round; if (!r || H.phase!=="playing") return;
  clearTimeout(H.timer);
  const pts = [3,2];
  const results = [];
  r.order.forEach((id,i)=>{
    const p = H.players.get(id); const b = r.boards[id];
    const add = i<2 ? pts[i] : 1;
    if (p) p.score += add;
    results.push({id, name:p?p.name:"(나감)", solved:true, rows:b.pats.length, ms:b.finishMs, add});
  });
  for (const id in r.boards){
    if (r.order.includes(id)) continue;
    const p = H.players.get(id); const b = r.boards[id];
    results.push({id, name:p?p.name:"(나감)", solved:false, rows:b.pats.length, ms:null, add:0});
  }
  r.results = results;
  H.phase = "result";
  const msg = reason==="time" ? "시간 종료!" : reason==="first" ? "첫 정답자가 나왔어요!" : "모두 끝났어요!";
  sysMsg(`${msg} 정답은 ${r.answer.toUpperCase()}`);
  hostBroadcastState();
}

function hostHandle(id, msg, conn){
  if (!msg || typeof msg!=="object") return;
  const p = H.players.get(id);

  if (msg.t==="hello"){
    if (!p){
      const name = uniqueName(msg.name, id);
      H.players.set(id, {name, score:0, conn: conn||null, joinedAt:Date.now()});
      sendTo(id, {t:"welcome", id, chat:H.chat, code:roomCode});
      sysMsg(`${name}님이 들어왔어요.` + (H.phase==="playing" ? " (이번 라운드는 관전)" : ""));
      hostBroadcastState();
    }
    return;
  }
  if (!p) return;

  switch(msg.t){
    case "chat": {
      const text = String(msg.text||"").trim().slice(0,200);
      if (text) hostAddChat({name:p.name, id, text, at:Date.now()});
      break;
    }
    case "settings": {
      if (id!==myId || H.phase==="playing") return;
      const s = msg.settings||{};
      if ([5,6,7,8].includes(s.len)) H.settings.len = s.len;
      if ([0,120,180,300].includes(s.time)) H.settings.time = s.time;
      if (["all","first"].includes(s.mode)) H.settings.mode = s.mode;
      hostBroadcastState();
      break;
    }
    case "start": {
      if (id!==myId || H.phase==="playing") return;
      hostStartRound();
      break;
    }
    case "resetScores": {
      if (id!==myId || H.phase==="playing") return;
      for (const pl of H.players.values()) pl.score = 0;
      sysMsg("점수가 초기화됐어요.");
      hostBroadcastState();
      break;
    }
    case "typing": {
      const r = H.round; if (!r || H.phase!=="playing") return;
      const b = r.boards[id]; if (!b || b.done) return;
      b.typing = Math.max(0, Math.min(r.len, msg.n|0));
      hostBroadcastRaw({t:"typing", id, n:b.typing});
      break;
    }
    case "guess": {
      const r = H.round;
      if (!r || H.phase!=="playing") return sendTo(id,{t:"err", text:"지금은 입력할 수 없어요"});
      const b = r.boards[id];
      if (!b) return sendTo(id,{t:"err", text:"이번 라운드는 관전 중이에요"});
      if (b.done) return;
      const w = String(msg.word||"").toLowerCase();
      if (w.length!==r.len || !/^[a-z]+$/.test(w)) return sendTo(id,{t:"err", text:`${r.len}글자 영어 단어를 입력하세요`});
      const pat = evaluate(w, r.answer);
      b.words.push(w); b.pats.push(pat); b.typing = 0;
      if (pat === "g".repeat(r.len)){
        b.solved = true; b.done = true; b.finishMs = Date.now() - r.startedAt;
        r.order.push(id);
        const rank = r.order.length;
        sysMsg(`🎉 ${p.name}님이 ${b.pats.length}번 만에 맞혔어요! (${rank}등)`);
      } else if (b.pats.length >= r.maxRows){
        b.done = true;
        sysMsg(`${p.name}님은 기회를 모두 썼어요.`);
      }
      hostBroadcastState();
      setTimeout(hostCheckEnd, 1400); // 마지막 줄 뒤집기 애니메이션을 보여준 뒤 종료
      break;
    }
  }
}

function hostRemove(id){
  const p = H.players.get(id); if (!p) return;
  H.players.delete(id);
  if (H.round && H.round.boards[id] && H.phase==="playing"){
    delete H.round.boards[id];
    H.round.order = H.round.order.filter(x=>x!==id);
  }
  sysMsg(`${p.name}님이 나갔어요.`);
  hostBroadcastState();
  hostCheckEnd();
}

  if (typeof Peer === "undefined" && typeof mqtt === "undefined"){
    setEntryBusy(false, "연결 라이브러리를 불러오지 못했어요. 새로고침해 보세요."); return false;

function newPeer(id){
  return new Promise((res, rej)=>{
    let done = false;
    const p = id ? new Peer(id, PEER_OPTS) : new Peer(PEER_OPTS);
    const t = setTimeout(()=>{ if(!done){ done=true; try{p.destroy();}catch(_){} rej(new Error("timeout")); } }, 10000);
    p.on("open", ()=>{ if(!done){ done=true; clearTimeout(t); res(p); } });
    p.on("error", e=>{ if(!done){ done=true; clearTimeout(t); try{p.destroy();}catch(_){} rej(e); } });
  });
}
function mqConnect(url, opts){
  return new Promise((res, rej)=>{
    if (typeof mqtt === "undefined"){ rej(new Error("nomqtt")); return; }
    let done = false;
    const c = mqtt.connect(url, Object.assign({connectTimeout:7000, reconnectPeriod:2000,
      clientId:"wd"+Math.random().toString(36).slice(2,12), clean:true}, opts||{}));
    c.on("connect", ()=>{ if(!done){ done=true; res(c); } });
    c.on("error", e=>{ if(!done){ done=true; try{c.end(true);}catch(_){} rej(e); } });
    setTimeout(()=>{ if(!done){ done=true; try{c.end(true);}catch(_){} rej(new Error("timeout")); } }, 8000);
  });
}

    for (let tries=0; tries<5; tries++){
      code = genCode();
      try{ pr = await newPeer(PREFIX + code); break; }
      catch(e){ pr = null; if (!(e && e.type==="unavailable-id")) break; }
    }
  }
  if (!code) code = genCode();
  if (!pr && typeof mqtt === "undefined"){ setEntryBusy(false, "방을 만들지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요."); return; }

  isHost = true; roomCode = code; myId = pr ? pr.id : "h-" + code;
  if (pr){
    peer = pr;
    pr.on("connection", conn=>{
      conn.on("data", d=>hostHandle(conn.peer, d, conn));
      conn.on("close", ()=>hostRemove(conn.peer));
      conn.on("error", ()=>hostRemove(conn.peer));
    });
    pr.on("disconnected", ()=>{ try{ pr.reconnect(); }catch(e){} });
    pr.on("error", e=>{ if (e.type!=="peer-unavailable") console.warn("peer", e.type); });
  }
  startHostRelay(code);

  H.players.set(myId, {name, score:0, conn:null, joinedAt:Date.now()});
  enterGame();
  onMessage({t:"welcome", id:myId, chat:[], code});
  sysMsg(`방이 만들어졌어요. 초대 링크를 친구들에게 보내 주세요!`);
  hostBroadcastState();
}

/* 중계 서버: 직접 연결이 안 되는 친구는 이쪽으로 들어옴 */
const relayClients = new Map();   // id -> {c, last}
function startHostRelay(code){
  const root = MQ_ROOT + code;
  for (const url of MQ_BROKERS){
    mqConnect(url).then(c=>{
      c.subscribe(root + "/c", {qos:0});
      c.on("message", (tp, buf)=>{
        const d = parseMsg(buf);
        if (!d || typeof d.id !== "string" || d.id.length > 40) return;
        if (d.t === "bye"){ const r0 = relayClients.get(d.id); if (r0 && r0.c === c){ relayClients.delete(d.id); hostRemove(d.id); } return; }
        let rc = relayClients.get(d.id);
        if (rc && rc.c !== c) return;   // 같은 친구 메시지가 다른 중계 서버로 중복 도착하면 무시
        if (d.t === "ping"){ if (rc) rc.last = Date.now(); return; }
        if (!d.m || typeof d.m !== "object") return;
        if (!rc){
          if (d.m.t !== "hello" || H.players.has(d.id)) return;
          rc = {c, last:Date.now()}; relayClients.set(d.id, rc);
        }
        rc.last = Date.now();
        const conn = { open:true, peer:d.id, send:(msg)=>{ try{ rc.c.publish(root + "/to/" + d.id, JSON.stringify(msg), {qos:0}); }catch(_){} } };
        hostHandle(d.id, d.m, conn);
      });
      // 중계로 들어온 친구에게 "방장 살아 있음" 신호
      setInterval(()=>{ if (relayClients.size) try{ c.publish(root + "/h", '{"t":"hb"}', {qos:0}); }catch(_){} }, 2500);
    }).catch(()=>{});
  }
  setInterval(()=>{
    const now = Date.now();
    for (const [id, rc] of relayClients) if (now - rc.last > 10000){ relayClients.delete(id); hostRemove(id); }
  }, 1500);
}

/* ---------- 참가자 ---------- */
async function joinRoom(){
  const name = getName(); if (!name || !netAvailable()) return;
  const code = normCode($("codeInp").value); $("codeInp").value = code;
  if (code.length!==5){ $("entryMsg").textContent = "5자리 방 코드를 입력하세요"; return; }
  setEntryBusy(true, "방에 연결하는 중… (최대 15초 정도 걸릴 수 있어요)");
  roomCode = code;
  let ok = false;
  if (typeof Peer !== "undefined") ok = await joinDirect(code, name);
  if (!ok && typeof mqtt !== "undefined"){
    setEntryBusy(true, "직접 연결이 안 돼서 중계 서버로 연결하는 중…");
    for (const url of MQ_BROKERS){ if (await joinRelay(code, name, url)){ ok = true; break; } }
  }
  if (!ok) setEntryBusy(false, `${code} 방에 들어갈 수 없어요. 코드가 맞는지, 방장이 게임 창을 켜 두고 있는지 확인해 주세요.`);
}

async function joinDirect(code, name){
  let pr;
  try{ pr = await newPeer(null); }catch(_){ return false; }
  const conn = await new Promise(res=>{
    let done = false;
    const c = pr.connect(PREFIX + code, {reliable:true});
    const t = setTimeout(()=>{ if(!done){ done=true; res(null); } }, 7000);
    c.on("open", ()=>{ if(!done){ done=true; clearTimeout(t); res(c); } });
    c.on("iceStateChanged", st=>{ if (st==="failed" && !done){ done=true; clearTimeout(t); res(null); } });
    pr.on("error", ()=>{ if(!done){ done=true; clearTimeout(t); res(null); } });
  });
  if (!conn){ try{ pr.destroy(); }catch(_){} return false; }
  peer = pr; hostConn = conn;
  conn.on("data", onMessage);
  conn.on("close", hostLost);
  pr.on("disconnected", ()=>{ try{ pr.reconnect(); }catch(e){} });
  conn.send({t:"hello", name});
  return true;
}

function joinRelay(code, name, url){
  return new Promise(async res=>{
    const id = "r" + Math.random().toString(36).slice(2,12);
    const root = MQ_ROOT + code;
    let c;
    try{ c = await mqConnect(url, {will:{topic:root+"/c", payload:JSON.stringify({t:"bye", id}), qos:0, retain:false}}); }
    catch(_){ res(false); return; }
    let got = false, lastHost = Date.now(), lost = false;
    const conn = { open:true, send:(msg)=>{ try{ c.publish(root+"/c", JSON.stringify({id, m:msg}), {qos:0}); }catch(_){} } };
    c.subscribe([root + "/to/" + id, root + "/h"], {qos:0});
    c.on("message", (tp, buf)=>{
      lastHost = Date.now();
      if (tp === root + "/h") return;
      const d = parseMsg(buf); if (!d) return;
      if (!got && d.t === "welcome"){
        got = true; clearInterval(helloTimer);
        hostConn = conn;
        sysLocalLater("중계 서버로 연결됐어요 (조금 느릴 수 있어요)");
      }
      if (got) onMessage(d);
    });
    let tries = 0;
    const hello = ()=>conn.send({t:"hello", name});
    const helloTimer = setInterval(()=>{
      if (++tries > 8){ clearInterval(helloTimer); if (!got){ try{ c.publish(root+"/c", JSON.stringify({t:"bye", id})); c.end(true); }catch(_){} res(false); } return; }
      hello();
    }, 1000);
    hello();
    setInterval(()=>{
      if (!got || lost) return;
      try{ c.publish(root+"/c", JSON.stringify({t:"ping", id}), {qos:0}); }catch(_){}
      if (Date.now() - lastHost > 12000){ lost = true; conn.open = false; hostLost(); }
    }, 2500);
    window.addEventListener("beforeunload", ()=>{ try{ c.publish(root+"/c", JSON.stringify({t:"bye", id})); }catch(_){} });
    const wait = setInterval(()=>{ if (got){ clearInterval(wait); res(true); } }, 100);
  });
}
function sysLocalLater(t){ setTimeout(()=>sysLocal(t), 300); }
function hostLost(){
  toast("방장과 연결이 끊겼어요", 4000);
  sysLocal("방장과 연결이 끊겼어요. 방장이 다시 방을 만들면 새 코드로 참가해 주세요.");
}

/* ================= 클라이언트: 메시지 처리 ================= */
function onMessage(m){
  if (!m || typeof m!=="object") return;
  switch(m.t){
    case "welcome":
      myId = m.id; roomCode = m.code || roomCode;
      if ($("game").classList.contains("hidden")) enterGame();
      $("chatLog").innerHTML = "";
      (m.chat||[]).forEach(addChat);
      break;
    case "state": applyState(m); break;
    case "chat": addChat(m.entry); break;
    case "typing":
      if (S && S.round && S.round.boards[m.id]){ S.round.boards[m.id].typing = m.n; renderOpps(); }
      break;
    case "err":
      pending = false; toast(m.text); shakeRow();
      break;
  }
}

function applyState(st){
  const prev = S; S = st;
  const r = st.round;
  if (st.roundNo !== lastRoundNo){
    lastRoundNo = st.roundNo; cur = ""; pending = false; lastRowCount = 0;
  }
  if (r){
    localDeadline = (r.remaining!=null && st.phase==="playing") ? performance.now() + r.remaining : null;
    const mb = r.boards[myId];
    const rows = mb ? mb.pats.length : 0;
    if (rows > lastRowCount){
      cur = ""; pending = false;
      const last = mb.pats[rows-1];
      renderAll(rows-1);
      lastRowCount = rows;
      if (mb.solved) toast(["천재!","대단해요!","훌륭해요!","좋아요!","잘했어요!","휴~ 아슬아슬!","겨우 맞혔어요!","마지막에 성공!"][Math.min(rows-1,7)], 2200);
      else if (mb.done) toast("아쉬워요! 기회를 다 썼어요", 2200);
      return;
    }
    lastRowCount = rows;
  } else localDeadline = null;
  renderAll(-1);
}

function addChat(e){
  const log = $("chatLog");
  const d = document.createElement("div");
  if (e.sys){ d.className = "cm sys"; d.textContent = "• " + e.text; }
  else {
    d.className = "cm";
    const w = document.createElement("span"); w.className="who"; w.textContent = e.name;
    w.style.color = colorFor(e.id);
    const t = document.createElement("span"); t.textContent = e.text;
    d.append(w,t);
  }
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  log.appendChild(d);
  if (atBottom) log.scrollTop = log.scrollHeight;
}
function sysLocal(text){ addChat({sys:true, text}); }
function colorFor(id){
  let h = 0; for (const c of String(id)) h = (h*31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 70% 68%)`;
}

function renderBoard(revealRow){
  const el = $("board");
  if (!S.round || S.phase!=="playing" || !S.round.boards[myId]){ el.innerHTML=""; return; }
  const r = S.round, b = r.boards[myId];
  const ts = Math.max(34, Math.min(58, Math.floor((Math.min(window.innerWidth, 540) - 40) / r.len) - 6));
  el.style.setProperty("--ts", ts + "px");
  let html = "";
  for (let i=0;i<r.maxRows;i++){
    html += `<div class="brow" style="grid-template-columns:repeat(${r.len},var(--ts))" data-r="${i}">`;
    for (let j=0;j<r.len;j++){
      if (i < b.pats.length){
        const ch = b.words ? b.words[i][j] : "";
        const rv = i===revealRow ? ` reveal" style="animation-delay:${j*0.12}s` : "";
        html += `<div class="tile ${b.pats[i][j]}${rv}">${ch}</div>`;
      } else if (i===b.pats.length && !b.done){
        const ch = cur[j]||"";
        html += `<div class="tile ${ch?"filled":""}">${ch}</div>`;
      } else html += `<div class="tile"></div>`;
    }
    html += `</div>`;
  }
  el.innerHTML = html;
}
function updateCurRow(){
  if (!S || !S.round) return;
  const b = S.round.boards[myId]; if (!b) return;
  const row = $("board").querySelector(`.brow[data-r="${b.pats.length}"]`);
  if (!row) return;
  [...row.children].forEach((t,j)=>{ const ch = cur[j]||""; t.textContent = ch; t.className = "tile" + (ch?" filled":""); });
}
function shakeRow(){
  if (!S || !S.round) return;
  const b = S.round.boards[myId]; if (!b) return;
  const row = $("board").querySelector(`.brow[data-r="${b.pats.length}"]`);
  if (!row) return;
  row.classList.remove("shake"); void row.offsetWidth; row.classList.add("shake");
}

function miniHTML(b, r, showLetters, big){
  let h = `<div class="mini${big?" big":""}">`;
  for (let i=0;i<r.maxRows;i++){
    h += `<div class="mr" style="grid-template-columns:repeat(${r.len},auto)">`;
    for (let j=0;j<r.len;j++){
      if (i < b.pats.length){
        const ch = showLetters && b.words ? b.words[i][j] : "";
        h += `<div class="mc ${b.pats[i][j]}">${ch}</div>`;
      } else if (i===b.pats.length && !b.done && j < (b.typing||0)) h += `<div class="mc t"></div>`;
      else h += `<div class="mc"></div>`;
    }
    h += `</div>`;
  }
  return h + `</div>`;
}

/* ================= 키보드 ================= */
const KB_ROWS = ["qwertyuiop","asdfghjkl","Ezxcvbnm<"];
function buildKeyboard(){
  const kb = $("kb"); kb.innerHTML = "";
  for (const row of KB_ROWS){
    const r = document.createElement("div"); r.className = "kr";
    for (const ch of row){
      const k = document.createElement("button");
      k.className = "key";
      if (ch==="E"){ k.textContent = "입력"; k.classList.add("wide"); k.dataset.k = "Enter"; }
      else if (ch==="<"){ k.textContent = "⌫"; k.classList.add("wide"); k.dataset.k = "Backspace"; }
      else { k.textContent = ch; k.dataset.k = ch; }
      k.addEventListener("click", e=>{ e.preventDefault(); press(k.dataset.k); k.blur(); });
      r.appendChild(k);
    }
    kb.appendChild(r);
  }
}
function renderKeys(){
  const st = {};
  const b = S && S.round && S.round.boards[myId];
  if (b && b.words){
    const rank = {b:1,y:2,g:3};
    b.words.forEach((w,i)=>{ for (let j=0;j<w.length;j++){ const c=w[j], p=b.pats[i][j]; if (!st[c] || rank[p]>rank[st[c]]) st[c]=p; } });
  }
  $("kb").querySelectorAll(".key").forEach(k=>{
    const c = k.dataset.k; k.classList.remove("g","y","b");
    if (st[c]) k.classList.add(st[c]);
  });
}

let typingTimer = null;
function sendTyping(){
  clearTimeout(typingTimer);
  typingTimer = setTimeout(()=>send({t:"typing", n:cur.length}), 80);
}

function press(k){
  if (!S || S.phase!=="playing" || !S.round) return;
  const b = S.round.boards[myId];
  if (!b || b.done || pending) return;
  const len = S.round.len;
  if (k==="Enter"){
    if (cur.length < len){ toast(`${len}글자를 채워 주세요`); shakeRow(); return; }
    if (!isValidWord(cur)){ toast("사전에 없는 단어예요"); shakeRow(); return; }
    if (b.words && b.words.includes(cur)){ toast("이미 입력한 단어예요"); shakeRow(); return; }
    pending = true;
    send({t:"guess", word:cur});
    return;
  }
  if (k==="Backspace"){ if (cur.length){ cur = cur.slice(0,-1); updateCurRow(); sendTyping(); } return; }
  if (/^[a-z]$/.test(k) && cur.length < len){ cur += k; updateCurRow(); sendTyping(); }
}

document.addEventListener("keydown", e=>{
  if ($("game").classList.contains("hidden")) return;
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (tag==="INPUT" || tag==="TEXTAREA") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  // 한글 입력 상태여도 동작하도록 e.code 사용
  const m = /^Key([A-Z])$/.exec(e.code || "");
  if (m){ e.preventDefault(); press(m[1].toLowerCase()); }
  else if (e.key==="Enter" || e.code==="Enter" || e.code==="NumpadEnter"){ e.preventDefault(); press("Enter"); }
  else if (e.key==="Backspace"){ e.preventDefault(); press("Backspace"); }
});

/* ================= UI 연결 ================= */
$("createBtn").onclick = ()=>createRoom();
$("joinBtn").onclick = joinRoom;
$("codeInp").addEventListener("keydown", e=>{ if (e.key==="Enter" && !e.isComposing) joinRoom(); });
$("codeInp").addEventListener("compositionend", e=>{ const v = normCode(e.target.value); setTimeout(()=>{ e.target.value = v; }, 0); });
$("codeInp").addEventListener("blur", e=>{ e.target.value = normCode(e.target.value); });
$("nameInp").addEventListener("keydown", e=>{ if (e.key==="Enter" && !e.isComposing){ $("codeInp").value.trim() ? joinRoom() : createRoom(); } });
$("chatForm").addEventListener("submit", e=>{
  e.preventDefault();
  const t = $("chatInp").value.trim(); if (!t) return;
  send({t:"chat", text:t}); $("chatInp").value = "";
  if (S && S.phase==="playing") $("chatInp").blur(); // 게임 중엔 보내고 바로 단어 입력으로 복귀
});
$("chatInp").addEventListener("keydown", e=>{ if (e.key==="Escape") $("chatInp").blur(); });
$("copyBtn").onclick = async ()=>{
  const link = location.origin + location.pathname + "?room=" + roomCode;
  try{ await navigator.clipboard.writeText(link); toast("초대 링크를 복사했어요!"); }
  catch(e){ prompt("이 링크를 복사해서 보내세요", link); }
};
window.addEventListener("resize", ()=>{ if (S) renderBoard(-1); });
window.addEventListener("beforeunload", ()=>{ try{ peer && peer.destroy(); }catch(e){} });

(function init(){
  const saved = load("wd_name"); if (saved) $("nameInp").value = saved;
  const q = new URLSearchParams(location.search).get("room");
  if (q){
    $("codeInp").value = normCode(q);
    $("createBtn").classList.remove("primary");
    $("joinBtn").classList.add("primary");
    $("entryMsg").textContent = "초대받은 방이에요. 닉네임을 쓰고 ‘참가’를 누르세요.";
  }
  loadDict();
})();
</script>
